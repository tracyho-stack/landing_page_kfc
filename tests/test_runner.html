<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>KFC Test Suite - Automated Module Verification</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 30px;
      background-color: #F7F3EF;
      color: #1F1F1F;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    h1 {
      color: #E4002B;
      margin-top: 0;
    }
    .test-card {
      padding: 14px 18px;
      margin-bottom: 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #ddd;
    }
    .test-card.pass {
      background-color: #E8F8F0;
      border-color: #2ECC71;
      color: #27AE60;
    }
    .test-card.fail {
      background-color: #FDEBD0;
      border-color: #E74C3C;
      color: #C0392B;
    }
    .status-badge {
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
    }
    .pass .status-badge {
      background-color: #2ECC71;
      color: white;
    }
    .fail .status-badge {
      background-color: #E74C3C;
      color: white;
    }
    .summary-box {
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      background-color: #1F1F1F;
      color: white;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 KFC Module Automated Test Suite</h1>
    <p>Kiểm tra tự động toàn bộ chức năng của Module 1 (Giỏ hàng) và Module 2 (Trang chi tiết sản phẩm):</p>
    
    <div id="test-results">Đang chạy các bài kiểm thử...</div>
    <div class="summary-box" id="summary-box" style="display: none;"></div>
  </div>

  <script src="../js/cart.js"></script>
  <script>
    (async function runTests() {
      const resultsContainer = document.getElementById("test-results");
      const summaryBox = document.getElementById("summary-box");
      const tests = [];

      function assert(name, condition, details = "") {
        tests.push({ name, passed: Boolean(condition), details });
      }

      // Test Suite 1: CSV Fetching & Format
      try {
        const res = await fetch("../data/products.csv");
        assert("CSV Data - File exists and accessible via fetch", res.ok);
        const text = await res.text();
        assert("CSV Data - Contains header columns", text.includes("id,name,category,description,price,original_price,image,featured"));
        assert("CSV Data - Contains Gà Rán Truyền Thống 40.000", text.includes("P001,Gà Rán Truyền Thống") && text.includes("40000"));
        assert("CSV Data - Contains Gà Rán Cay Best Seller 45.000", text.includes("P002,Gà Rán Cay (Best Seller)") && text.includes("45000"));
        assert("CSV Data - Contains Khoai Tây Chiên 20.000", text.includes("P003,Khoai Tây Chiên") && text.includes("20000"));
        assert("CSV Data - Contains Hamburger Gà / Bò / Tôm 50.000", text.includes("P004,Hamburger Gà") && text.includes("P005,Hamburger Bò") && text.includes("P006,Hamburger Tôm"));
        assert("CSV Data - Contains Pepsi / Coca / 7Up 10.000", text.includes("P007,Pepsi (Ly)") && text.includes("P008,Coca Cola (Ly)") && text.includes("P009,7Up (Ly)"));
      } catch (e) {
        assert("CSV Data - Fetch Exception", false, e.message);
      }

      // Test Suite 2: CartManager API & State
      try {
        CartManager.clearCart();
        assert("CartManager - Initial cart is empty", CartManager.getItems().length === 0);
        assert("CartManager - Total count is 0", CartManager.getTotalCount() === 0);
        assert("CartManager - Total price is 0", CartManager.getTotalPrice() === 0);

        // Add 1 item
        const p1 = { id: "P001", name: "Gà Rán Truyền Thống", category: "Fried Chicken", price: 40000, image: "assets/images/original-chicken.webp" };
        CartManager.addItem(p1, 2);
        assert("CartManager - Add item adds correct quantity", CartManager.getTotalCount() === 2 && CartManager.getTotalPrice() === 80000);

        // Add same item increments quantity
        CartManager.addItem(p1, 1);
        assert("CartManager - Re-adding same item increments quantity", CartManager.getTotalCount() === 3 && CartManager.getTotalPrice() === 120000);

        // Add second item
        const p2 = { id: "P002", name: "Gà Rán Cay (Best Seller)", category: "Fried Chicken", price: 45000, image: "assets/images/spicy-chicken.webp" };
        CartManager.addItem(p2, 2);
        assert("CartManager - Multiple items correctly counted", CartManager.getItems().length === 2 && CartManager.getTotalPrice() === 120000 + 90000);

        // Update quantity
        CartManager.updateQuantity("P001", -1);
        assert("CartManager - updateQuantity decrements item", CartManager.getTotalCount() === 4);

        // LocalStorage sync check
        const saved = JSON.parse(localStorage.getItem("kfc_cart_items") || "[]");
        assert("CartManager - Synchronized with localStorage", saved.length === 2 && saved[0].id === "P001");

        // Clear cart
        CartManager.clearCart();
        assert("CartManager - clearCart resets everything", CartManager.getItems().length === 0 && CartManager.getTotalPrice() === 0);
      } catch (e) {
        assert("CartManager - Exception", false, e.message);
      }

      // Render Test Results
      let passedCount = 0;
      resultsContainer.innerHTML = tests.map(t => {
        if (t.passed) passedCount++;
        return `
          <div class="test-card ${t.passed ? 'pass' : 'fail'}">
            <span><strong>${t.name}</strong> ${t.details ? `<small>(${t.details})</small>` : ''}</span>
            <span class="status-badge">${t.passed ? 'PASSED ✓' : 'FAILED ✗'}</span>
          </div>
        `;
      }).join("");

      summaryBox.style.display = "flex";
      summaryBox.innerHTML = `
        <span>Tổng số bài test: ${tests.length}</span>
        <span>Thành công: ${passedCount} / ${tests.length} (${Math.round(passedCount/tests.length * 100)}%)</span>
      `;
    })();
  </script>
</body>
</html>
